name: client-builds

on:
  pull_request:
  workflow_dispatch:

jobs:
  desktop-linux:
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-24.04"]' || vars.RUNNER || '["ubuntu-24.04"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Electron native libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsecret-1-dev libxss1 rpm fakeroot dpkg
      - name: Build an unsigned Linux desktop package
        working-directory: clients/upstream
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -eu
          npm install -g npm@11.6.2
          npm ci
          npm run build:oss --workspace @bitwarden/desktop
          cd apps/desktop
          npx electron-builder --linux deb AppImage --x64 -p never
          ls -l dist
          python3 "$GITHUB_WORKSPACE/scripts/ensure-linux-feed.py" dist
      - name: Unpacked desktop app has no Bitwarden branding
        run: python3 scripts/check_branding.py --built clients/upstream/apps/desktop/dist/linux-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-unsigned
          path: |
            clients/upstream/apps/desktop/dist/*.deb
            clients/upstream/apps/desktop/dist/*.AppImage
            clients/upstream/apps/desktop/dist/latest-linux.yml

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build an unsigned Windows desktop package
        working-directory: clients/upstream
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install -g npm@11.6.2
          npm ci
          npm run build:oss --workspace @bitwarden/desktop
          cd apps/desktop
          npx electron-builder --win nsis --x64 -p never --config.win.target=nsis
      - name: Unpacked desktop app has no Bitwarden branding
        run: python scripts/check_branding.py --built clients/upstream/apps/desktop/dist/win-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-unsigned
          path: |
            clients/upstream/apps/desktop/dist/*.exe
            clients/upstream/apps/desktop/dist/latest.yml

  android-release:
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-24.04"]' || vars.RUNNER || '["ubuntu-24.04"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Production Android signing check
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p dist
            printf '%s\n' "No ANDROID_KEYSTORE_BASE64 secret is configured." > dist/android-signing-absent.txt
            printf '%s\n' "mobile/android-build.sh only runs :app:assembleFdroidDebug." >> dist/android-signing-absent.txt
            printf '%s\n' "A release APK was not built and a signing key was not created." >> dist/android-signing-absent.txt
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: steps.sign.outputs.present == 'true'
        with:
          cmdline-tools-version: "15859902"
          log-accepted-android-sdk-licenses: "false"
          packages: "platform-tools platforms;android-37.2 build-tools;37.0.0"
      - name: Build the F-Droid release APK when a keystore already exists
        if: steps.sign.outputs.present == 'true'
        run: |
          set -eu
          pin=$(cat mobile/ANDROID_UPSTREAM_PIN)
          git clone --depth 1 -b "$pin" https://github.com/bitwarden/android.git /tmp/bw-android
          python3 mobile/android_rebrand.py /tmp/bw-android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/komboe.keystore
          cd /tmp/bw-android
          ./gradlew --no-daemon :app:assembleFdroidRelease \
            -Pandroid.injected.signing.store.file=/tmp/komboe.keystore \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find app/build/outputs/apk -name '*.apk' ! -name '*debug*' -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-status
          path: dist/*

  android-debug:
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-24.04"]' || vars.RUNNER || '["ubuntu-24.04"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: "15859902"
          log-accepted-android-sdk-licenses: "false"
          packages: "platform-tools platforms;android-37.2 build-tools;37.0.0"
      - name: Build the rebranded fdroid debug APK
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          python3 -m pip install --quiet Pillow fonttools brotli
          pin=$(cat mobile/ANDROID_UPSTREAM_PIN)
          git clone --depth 1 -b "$pin" https://github.com/bitwarden/android.git /tmp/bw-android
          python3 mobile/android_rebrand.py /tmp/bw-android
          python3 mobile/stamp-version.py /tmp/bw-android 2026111509 2026.11.15.9
          mkdir -p "$HOME/.android"
          if [ -n "${ANDROID_DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          fi
          cd /tmp/bw-android
          ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx3g :app:assembleFdroidDebug
          apk=$(find app/build/outputs/apk -name '*.apk' | head -1)
          python3 "$GITHUB_WORKSPACE/scripts/check_branding.py" --built "$apk"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$apk" "$GITHUB_WORKSPACE/dist/io.komboe.android-2026.11.15.9.apk"
          python3 - << PY
          import hashlib, json, os, struct
          from pathlib import Path
          apk = Path("$apk")
          data = apk.read_bytes()
          idx = data.rfind(b"\x50\x4b\x05\x06")
          cd_off = struct.unpack_from("<I", data, idx + 16)[0]
          assert data[cd_off - 16:cd_off] == b"APK Sig Block 42"
          size2 = struct.unpack_from("<Q", data, cd_off - 24)[0]
          block_start = cd_off - size2 - 8
          pairs = data[block_start + 8:cd_off - 24]
          p = 0
          cert = b""
          while p + 12 <= len(pairs):
              plen = struct.unpack_from("<Q", pairs, p)[0]
              pid = struct.unpack_from("<I", pairs, p + 8)[0]
              val = pairs[p + 12:p + 8 + plen]
              if pid == 0x7109871A and len(val) >= 4:
                  slen = struct.unpack_from("<I", val, 0)[0]
                  signers = val[4:4 + slen]
                  s1 = struct.unpack_from("<I", signers, 0)[0]
                  signer = signers[4:4 + s1]
                  sdlen = struct.unpack_from("<I", signer, 0)[0]
                  sd = signer[4:4 + sdlen]
                  diglen = struct.unpack_from("<I", sd, 0)[0]
                  rest = sd[4 + diglen:]
                  clen = struct.unpack_from("<I", rest, 0)[0]
                  certs = rest[4:4 + clen]
                  c1 = struct.unpack_from("<I", certs, 0)[0]
                  cert = certs[4:4 + c1]
                  break
              p += 8 + plen
          digest = hashlib.sha256(cert).hexdigest()
          file_hash = hashlib.sha256(data).hexdigest()
          Path("$GITHUB_WORKSPACE/dist/android-apk.txt").write_text(
              f"file sha256 {file_hash}\nsigner sha256 {digest}\nversionName 2026.11.15.9\nversionCode 2026111509\n"
          )
          versioned = "io.komboe.android-2026.11.15.9.apk"
          feed = {
              "versionName": "2026.11.15.9",
              "versionCode": 2026111509,
              "apkUrl": "https://komboe.com/downloads/android/" + versioned,
              "sha256": file_hash,
              "minSdk": 29,
              "releaseNotes": "Komboe updates download on Wi-Fi or mobile data and install with the same signing certificate.",
          }
          if feed["sha256"] != file_hash or feed["versionCode"] != 2026111509:
              raise SystemExit("latest.json does not match the APK")
          if "downloads.komboe.com" in feed["apkUrl"] or not feed["apkUrl"].startswith("https://komboe.com/downloads/android/"):
              raise SystemExit("apkUrl must be https://komboe.com/downloads/android/")
          Path("$GITHUB_WORKSPACE/dist/latest.json").write_text(json.dumps(feed, indent=2) + "\n")
          print("signer", digest)
          print("apk", file_hash)
          print("latest.json", feed["versionCode"], feed["sha256"])
          if os.environ.get("ANDROID_DEBUG_KEYSTORE_BASE64") and not digest.startswith("0418ff9b"):
              raise SystemExit("debug keystore secret is not the Komboe signer 0418ff9b")
          PY
          python3 "$GITHUB_WORKSPACE/tests/features/android_feed_match.py" "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: android-fdroid-debug
          path: dist/*

  download-manifest:
    needs: [desktop-linux, desktop-windows, android-release, android-debug]
    if: always()
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-24.04"]' || vars.RUNNER || '["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: desktop-*
          path: gathered
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-fdroid-debug
          path: gathered-android
      - name: latest.json matches the built APK
        run: python3 tests/features/android_feed_match.py gathered-android
      - name: Record checksums without publishing a download URL
        run: |
          set -eu
          mkdir -p dist
          if find gathered -name '*.deb' | grep -q .; then
            deb=$(find gathered -name '*.deb' | head -1)
            cp "$deb" "dist/$(basename "$deb")"
          fi
          if find gathered -name '*.AppImage' | grep -q .; then
            image=$(find gathered -name '*.AppImage' | head -1)
            cp "$image" "dist/$(basename "$image")"
          fi
          if find gathered -name 'latest-linux.yml' | grep -q .; then
            cp "$(find gathered -name 'latest-linux.yml' | head -1)" dist/latest-linux.yml
          fi
          if find gathered -name '*.exe' | grep -q .; then
            cp "$(find gathered -name '*.exe' | head -1)" dist/komboe-desktop-win-x64-setup.exe
          fi
          python3 scripts/build-downloads-manifest.py \
            --artifacts dist \
            --record-checksums \
            --revision "${{ github.sha }}" \
            --out dist/komboe-downloads.json
          EXPECTED_REVISION="${{ github.sha }}" python3 - << 'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path("dist/komboe-downloads.json").read_text())
          if manifest.get("revision") != os.environ["EXPECTED_REVISION"]:
              raise SystemExit(f"checksum manifest revision {manifest.get('revision')} is not {os.environ['EXPECTED_REVISION']}")
          for asset in manifest["assets"]:
              if asset["url"] or asset["status"] == "published":
                  raise SystemExit(f"checksum job must not publish a URL: {asset['id']}")
              if asset["status"] == "checksum" and not asset["sha256"]:
                  raise SystemExit(f"checksum missing: {asset['id']}")
          print("checksum assets", [(a["id"], a["status"], a["sha256"]) for a in manifest["assets"]])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: komboe-downloads-checksums
          path: dist/komboe-downloads.json
